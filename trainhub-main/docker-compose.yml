services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainhub}
      POSTGRES_DB: ${POSTGRES_DB:-trainhub}
    volumes:
      - trainhub_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainhub}:${POSTGRES_PASSWORD:-trainhub}@db:5432/${POSTGRES_DB:-trainhub}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8888}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "7777:7777"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:8888"
    depends_on:
      - backend

volumes:
  trainhub_db_data:
